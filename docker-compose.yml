version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: tours-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: tours-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: Tours
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tours-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
